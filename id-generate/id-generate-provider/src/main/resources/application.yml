server:
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: id-generate-provider
  profiles:
    active: dev
  config:
    import: ""
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: dev
        group: DEFAULT_GROUP
        enabled: true
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/id_generator?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

# CosId配置
cosid:
  namespace: id-generate
  machine:
    distributor:
      type: jdbc
    guarder:
      enabled: true
  snowflake:
    provider:
      local:
        biz:
          epoch: 1640995200000
          machine-id: 0
          timestamp-bit: 39
          sequence-bit: 12
    share:
      clock-sync: true
      safe-js: true

# Dubbo配置
dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    logger: slf4j
  registry:
    address: nacos://nacos:8848
  protocol:
    name: dubbo
    port: 20881
  consumer:
    check: false
    timeout: 3000
    retries: 0
  scan:
    base-packages: com.ti.id.provider

# 日志配置
logging:
  level:
    root: info
    com.ti: debug
    org.apache.dubbo: info
    com.alibaba.nacos: info
    me.ahoo.cosid: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
