ti:
  redis:
    # 是否启用 Redis（默认 true）
    enabled: true
    # Redis 服务器地址
    host: redis
    # Redis 服务器端口
    port: 6379
    # Redis 服务器密码（如果没有设置密码则留空）
    password:
    # Redis 数据库索引（默认为 0）
    database: 0
    # 连接超时时间（毫秒）
    timeout: 3000
    # 连接池配置
    pool:
      # 连接池最大连接数（使用负值表示没有限制）
      max-active: 8
      # 连接池最大阻塞等待时间（使用负值表示没有限制）
      max-wait: -1
      # 连接池中的最大空闲连接
      max-idle: 8
      # 连接池中的最小空闲连接
      min-idle: 0
