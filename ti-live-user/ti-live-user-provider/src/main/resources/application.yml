server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: ti-live-user-provider
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: dev
        group: DEFAULT_GROUP
        enabled: false
      config:
        server-addr: nacos:8848
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yaml
        enabled: false
  config:
    import: ""
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://host.docker.internal:3306/ti_live_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

# 容联云短信配置
cloopen:
  sms:
    server-ip: app.cloopen.com
    server-port: "8883"
    account-sid: YOUR_ACCOUNT_SID
    account-token: YOUR_ACCOUNT_TOKEN
    app-id: YOUR_APP_ID
    template-id: "1"

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# Dubbo 配置
dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    logger: slf4j
  registry:
    address: nacos://nacos:8848
  protocol:
    name: dubbo
    port: 20880
    serialization: hessian2
  provider:
    timeout: 3000
    retries: 0
    threads: 200
  scan:
    base-packages: com.ti
  consumer:
    check: false

# 日志配置
# 使用 logback-spring.xml 配置文件，此处仅做补充
logging:
  # 指定日志配置文件位置
  config: classpath:logback-spring.xml
  # 日志级别配置（会被 logback-spring.xml 覆盖）
  level:
    root: info
    com.ti: debug
    com.provider: debug
    org.apache.dubbo: info
    com.alibaba.nacos: info
    com.baomidou.mybatisplus: debug
    org.springframework.jdbc: debug
  # 日志文件路径
  file:
    path: logs
    name: logs/ti-live-user-provider.log
  # 控制台日志格式
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
