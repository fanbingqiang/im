server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: ti-live-im-provider
  profiles:
    active: dev
  config:
    import: ""
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: dev
        group: DEFAULT_GROUP
        enabled: true
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/im_live?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: redis
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 60000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ti.live.im.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Dubbo配置
dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    logger: slf4j
  registry:
    address: nacos://nacos:8848
    parameters:
      namespace: dev
      group: DUBBO_GROUP
  protocol:
    name: dubbo
    port: 20883
  consumer:
    check: false
    timeout: 3000
    retries: 0
  scan:
    base-packages: com.ti

# 日志配置
logging:
  level:
    root: info
    com.ti: debug
    org.apache.dubbo: info
    com.alibaba.nacos: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
